[project]
name = "mah-beauty"
version = "0.1.0"
description = "Mah Beauty — Django API backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<7.0",
    "djangorestframework>=3.15",
    "django-filter>=24.0",
    "django-jazzmin>=3.0",
    "Pillow>=10.0",
    "requests>=2.31",
    "django-environ>=0.11",
    "pytest-django>=4.14.0",
    "requests-mock>=1.12.1",
    "websockets>=12.0",
    "django-allauth>=65.18,<66",
    "dj-rest-auth[with-social]==7.2.0",
    "djangorestframework-simplejwt>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "requests-mock>=1.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mah_beauty_project.settings"
python_files = ["test_*.py"]
testpaths = ["shop/tests", "accounts/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
]
